<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Flow is a free, local-first cycle tracker. Your personal tracking data stays on your device.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Flow | Private cycle tracking</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">flow</span><span class="privacy-pill">local first</span></div>
      <button class="icon-button" id="installBtn" hidden aria-label="Install Flow">Install</button>
    </header>

    <main id="app" class="main" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-view="track" class="nav-item active"><span>◷</span><small>Track</small></button>
      <button data-view="knowledge" class="nav-item"><span>⌕</span><small>Knowledge</small></button>
      <button data-view="community" class="nav-item"><span>○</span><small>Community</small></button>
      <button data-view="help" class="nav-item"><span>?</span><small>Help</small></button>
      <button data-view="settings" class="nav-item"><span>⚙</span><small>Settings</small></button>
    </nav>
  </div>

  <dialog id="logDialog" class="dialog">
    <form method="dialog" id="logForm">
      <div class="dialog-head"><div><p class="eyebrow">Daily log</p><h2 id="logTitle">Log today</h2></div><button class="close" value="cancel" aria-label="Close">×</button></div>
      <input type="hidden" id="logDate">
      <div class="field-grid">
        <label><span>Flow</span><select id="flow"><option value="">Not logged</option><option>Spotting</option><option>Light</option><option>Medium</option><option>Heavy</option></select></label>
        <label><span>Pain</span><select id="pain"><option value="">Not logged</option><option>None</option><option>Mild</option><option>Moderate</option><option>Severe</option></select></label>
      </div>
      <label class="field"><span>Symptoms</span><input id="symptoms" placeholder="e.g. cramps, headache, bloating"></label>
      <label class="field"><span>Notes</span><textarea id="notes" rows="4" placeholder="Anything worth remembering"></textarea></label>
      <label class="check"><input type="checkbox" id="periodDay"> <span>Count this as a period day</span></label>
      <div class="dialog-actions"><button class="button ghost" value="cancel">Cancel</button><button class="button primary" value="default">Save locally</button></div>
    </form>
  </dialog>

  <dialog id="onboarding" class="dialog onboarding">
    <form method="dialog" id="onboardingForm">
      <p class="eyebrow">Welcome to Flow</p>
      <h1>Tracking without the baggage.</h1>
      <p class="muted">Your tracking data is kept in this browser. No account is required. Nothing is sent to Flow's servers.</p>
      <label class="field"><span>Who are you tracking?</span><select id="profileMode"><option value="self">My cycle</option><option value="partner">Someone else's cycle</option></select></label>
      <label class="field"><span>Name or nickname <em>optional</em></span><input id="profileName" maxlength="40" placeholder="e.g. Me, her, Alex"></label>
      <label class="field"><span>Last period started</span><input id="onboardStart" type="date"></label>
      <div class="field-grid">
        <label><span>Typical cycle</span><input id="cycleLength" type="number" min="15" max="90" value="28"></label>
        <label><span>Typical period</span><input id="periodLength" type="number" min="1" max="15" value="5"></label>
      </div>
      <label class="check"><input type="checkbox" id="onboardConsent" required> <span>I understand this data is stored locally and can be lost if browser storage is cleared. I will keep a backup.</span></label>
      <button class="button primary full" value="default">Start tracking</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
