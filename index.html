<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f2ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Ritmi is a private, local-first cycle tracker.">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=13">
<title>Ritmi | Your cycle. Your data.</title>
</head>
<body>
<div class="app-shell">
<header class="topbar"><a class="brand" href="#today" aria-label="Ritmi"><span>ritmi</span></a><div class="local-status"><i></i> on device</div></header>
<main id="app" aria-live="polite">
<section class="boot-screen" aria-label="Ritmi">
<div><span class="boot-kicker">ritmi</span><h1>Your rhythm,<br>kept private.</h1><p>Everything stays on this device.</p></div>
</section>
</main>
<nav class="bottom-nav" aria-label="Primary navigation"><button class="nav-item active" data-view="today"><span>Today</span></button><button class="nav-item" data-view="calendar"><span>Calendar</span></button><button class="nav-item" data-view="insights"><span>Insights</span></button><button class="nav-item" data-view="settings"><span>Settings</span></button></nav>
</div>
<div id="sheet" class="sheet-wrap" hidden><button class="sheet-backdrop" data-close-sheet aria-label="Close"></button><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-grab"></div><div class="sheet-head"><div><span class="kicker" id="sheet-kicker">Log</span><h2 id="sheet-title">How was today?</h2></div><button class="icon-button" data-close-sheet aria-label="Close">×</button></div><form id="log-form"><input type="hidden" id="log-date"><button type="button" class="period-toggle" id="period-toggle"><span class="period-dot"></span><span><strong>Period day</strong><small>Mark today as part of your period</small></span><b>○</b></button><div class="form-section"><label>Flow<select id="flow"><option value="">Not logged</option><option>Spotting</option><option>Light</option><option>Medium</option><option>Heavy</option></select></label><label>Pain<select id="pain"><option value="">Not logged</option><option>None</option><option>Mild</option><option>Moderate</option><option>Severe</option></select></label></div><label class="notes-field">Note<input id="notes" maxlength="300" placeholder="Anything worth remembering"></label><button class="save-button" type="submit">Save to this device</button></form></section></div>
<div id="onboarding" class="sheet-wrap" hidden><button class="sheet-backdrop" data-close-onboarding aria-label="Close"></button><section class="sheet onboarding-sheet" role="dialog" aria-modal="true" aria-labelledby="welcome-title"><div class="sheet-grab"></div><span class="kicker">A quieter tracker</span><h2 id="welcome-title">Know your rhythm.<br>Keep it yours.</h2><p class="lede">Ritmi works without an account. Your cycle history stays in this browser unless you choose to export it.</p><form id="onboarding-form"><label>Last period started<input id="onboard-start" type="date" required></label><div class="form-section"><label>Typical cycle<input id="cycle-length" type="number" min="15" max="90" value="28" required></label><label>Typical period<input id="period-length" type="number" min="1" max="15" value="5" required></label></div><label class="consent"><input id="consent" type="checkbox" required><span>I understand this data is stored locally on this device.</span></label><button class="save-button" type="submit">Start privately</button></form></section></div>
<script src="app.js?v=13"></script>
</body></html>
