name: NijRitu Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check core.js
          node --check v03.js
          node --check v03-reminders.js
          node --check v04.js
          node --check v05.js
          node --check v06-data.js
          node --check v07-experience.js
          node --check v08-trust.js
          node --check sw.js
          node --check tests/core.test.js
          node --check backend/storage.js
          node --check backend/server.js
          node --check backend/server.test.js
      - name: Run test suite
        run: node tests/core.test.js && node backend/server.test.js
      - name: Check required launch files
        run: |
          test -f index.html
          test -f styles.css
          test -f v08-trust.css
          test -f app.js
          test -f core.js
          test -f v03.js
          test -f v03-reminders.js
          test -f v04.js
          test -f v05.js
          test -f v06-data.js
          test -f v07-experience.js
          test -f v08-trust.js
          test -f tests/core.test.js
          test -f backend/storage.js
          test -f backend/server.js
          test -f backend/server.test.js
          test -f manifest.json
          test -f sw.js
          test -f privacy.html
      - name: Check manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest.json valid')"
