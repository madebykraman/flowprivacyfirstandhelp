name: NijRitu Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check core.js
          node --check sw.js
          node --check tests/core.test.js
      - name: Run cycle engine tests
        run: node tests/core.test.js
      - name: Check required launch files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f core.js
          test -f tests/core.test.js
          test -f manifest.json
          test -f sw.js
          test -f privacy.html
      - name: Check manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest.json valid')"
