name: Deploy Ritmi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare launch bundle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app-complete.js')
          s=p.read_text()
          s=s.replace("return'<option '+(l.discharge===x?'selected':'')+'>'+x+'</option>').join('')", "return'<option '+(l.discharge===x?'selected':'')+'>'+x+'</option>'}).join('')")
          s=s.replace("$('[data-overlay]')?.remove();", "var ov=$('[data-overlay]');if(ov)ov.remove();")
          p.write_text(s)
          PY
      - name: Verify product assets
        shell: bash
        run: |
          test -s index.html
          test -s ritmi-v3.css
          test -s ritmi-3-3.css
          test -s ritmi-next.css
          test -s app-complete.js
          grep -q 'ritmi-next.css?v=64' index.html
          grep -q 'ritmi-enhancements.js?v=64' index.html
          grep -q "const CACHE='ritmi-static-v3.4.0'" sw.js
          grep -q 'quiet-nav' ritmi-enhancements.js
          grep -q 'display:none!important' ritmi-3-3.css
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
